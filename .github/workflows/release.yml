# Builds the Windows, Linux and macOS downloads on GitHub's machines and attaches them to a draft release.
#
# Release: bump <Version> in Directory.Build.props, commit, push, then tag that commit:
#   git tag v1.0.1 && git push origin v1.0.1
# When the builds finish, a draft release with all the files and SHA256SUMS.txt is waiting under Releases;
# write the notes there and publish it. Nothing is public until then.
#
# "Run workflow" on the Actions tab builds everything without making a release; the files are then under the run's
# Artifacts, for trying a build before tagging it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test
      - name: Package
        run: packaging\package-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: publish/windows/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match <Version>$VERSION</Version> in Directory.Build.props"
            exit 1
          fi
      - name: Test
        run: dotnet test
      - name: Package
        run: packaging/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: publish/linux/*.tar.gz
          if-no-files-found: error

  macos:
    # Built on a Mac so package-macos.sh can apply the ad-hoc signature Apple Silicon needs (not notarized).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Package
        run: packaging/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: publish/macos/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the draft release (or update the files of an existing release for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "Vid Archiver GUI ${GITHUB_REF_NAME#v}" --generate-notes
          fi
